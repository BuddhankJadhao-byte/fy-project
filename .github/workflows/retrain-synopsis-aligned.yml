name: Retrain synopsis-aligned model

on:
  push:
    branches:
      - agent/synopsis-alignment

permissions:
  contents: write

jobs:
  retrain-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Apply synopsis preprocessing and retrain with TimeSeriesSplit
        run: python scripts/train_models.py

      - name: Refresh forecasts, figures, and PDF
        run: python scripts/generate_report.py

      - name: Validate final artifacts
        run: python scripts/validate_project.py

      - name: Commit verified generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed models outputs
          if ! git diff --cached --quiet; then
            git commit -m "Retrain synopsis-aligned forecasting artifacts"
            git push
          fi
